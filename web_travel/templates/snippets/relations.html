
<section class="relations">
  <h2>Connect tags</h2>

  <div class="selected">
  {% if item and item.relations %}
  {% for active_rel in item.relations %}
    <button type="button" data-rel="{{ active_rel.relation }}" data-id="{{ active_rel.relationFK }}">
      {{ current_relations[active_rel.relation][active_rel.relationFK] }}
    </button>
  {% endfor %}
  {% endif %}
  </div>
  <br/>

  <div class="available">
    <label for="_filter">Type to filter available tags: </label>
    <input type="text" name="_filter" class="relation_search inline" >
    {% for rel_type, rels in all_relations.items() %}
      <div data-rel-group="{{ rel_type }}"><span class="rel_label">{{ rel_type|capitalize|replace('y', 'ie') }}s:</span>
      {% for rel_id, rel_name in rels.items() %}
        <button type="button" data-rel="{{ rel_type }}" data-id="{{ rel_id }}">{{ rel_name }}</button>
      {% endfor %}
      </div>
    {% endfor %}
  </div>
</section>

<script>
(function () {
  const section   = document.querySelector('section.relations');
  const selected  = section.querySelector('.selected');
  const available = section.querySelector('.available');
  const form      = section.closest('form');

  // move tags from selected to available and vice versa
  section.addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-rel]');
    if (!btn) return;
    e.preventDefault();
    if (btn.parentElement === selected) {
      available.querySelector('[data-rel-group="' + btn.dataset.rel + '"]').appendChild(btn);
    } else {
      selected.appendChild(btn);
    }
  });

  // filter available objects
  available.querySelector('input[name="_filter"]').addEventListener('input', function (e) {
    const q = e.target.value.trim().toLowerCase();
    available.querySelectorAll('button[data-rel]').forEach(b => {
      b.hidden = q && !b.textContent.toLowerCase().includes(q);
    });
  });

  // prepare form input fields
  form.addEventListener('submit', function () {
    form.querySelectorAll('input[name="relations[]"]').forEach(n => n.remove());
    selected.querySelectorAll('button[data-rel]').forEach(b => {
      const i = document.createElement('input');
      i.type = 'hidden';
      i.name = 'relations[]';
      i.value = b.dataset.rel + ':' + b.dataset.id;
      form.appendChild(i);
    });
  });
})();
</script>
