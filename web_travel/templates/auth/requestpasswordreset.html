{% extends 'base.html' %}

{% block header %}
  <h2>{% block title %}Reset password{% endblock %}</h2>
{% endblock %}

{% block content %}
  <form method="post">
    <label for="email">Registered Email</label>
    <input type="email" name="email" id="email" required>
    <input type="submit" value="Send password reset link">
  </form>
{% endblock %}
