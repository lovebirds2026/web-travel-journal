{% extends 'base.html' %}

{% block header %}
  <h2>{% block title %}Photo management{% endblock %}</h2>
{% endblock %}

{% block content %}
  <form method="post" enctype="multipart/form-data">
    <label for="photos">Select Photos</label>
    <input type="file" name="photos" id="photos" multiple accept=".jpg,.jpeg,.avif,.png">
    <br/>
    <input type="submit" value="Save changes">
  </form>
{% endblock %}
